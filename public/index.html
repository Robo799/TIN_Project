<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Survival Game</title>
    <link rel="stylesheet" href="/stylesheets/style.css" />
</head>
<body>
<div id="wrap">
    <div id="titleScreen" class="screen">
        <h1>Survival Game</h1>
        <p>Move with WASD. Don't let him reach the phone.</p>
        <button id="startBtn">Start</button>
    </div>

    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="ui">
            <div class="left">
                <button id="scoresToggleBtn">Scores</button>
                <button id="restartBtn">Restart</button>
            </div>
        </div>
    </div>

    <div id="audioControls">
        <label><input type="checkbox" id="musicToggle" checked> Music</label>
        <label><input type="checkbox" id="sfxToggle" checked> SFX</label>
    </div>

    <div id="scoreScreen" class="screen hidden">
        <h2>Game Over</h2>
        <img src="images/over.png">
        <div id="finalStats"></div>

        <div id="submitPanel">
            <input id="nameInput" placeholder="Your name (2-20)" maxlength="20" />
            <button id="submitBtn">Submit score</button>
            <div id="submitMsg"></div>
        </div>

        <button id="backToTitleBtn">Back to title</button>
    </div>

    <div id="highscores" class="hidden">
        <div id="highscoresHeader">
            <div><b>High Scores</b></div>
            <div>
                <button id="prevPageBtn">Prev</button>
                <span id="pageInfo"></span>
                <button id="nextPageBtn">Next</button>
            </div>
        </div>
        <div id="highscoresList"></div>
    </div>

</div>

<script src="/javascripts/game.js"></script>
</body>
</html>
